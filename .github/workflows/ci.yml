name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: typecheck + tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build web
        run: pnpm -C apps/web build

      - name: Render QA smoke (Node canvas)
        run: pnpm qa:render

      - name: Visual regression vs baselines
        run: pnpm qa:visual

      - name: Algorithm distribution gate
        run: pnpm qa:algo

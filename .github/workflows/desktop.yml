name: Desktop

# Builds the Electron shell on all three platforms and uploads the (unsigned)
# installers.
#
# Signing is intentionally disabled: the repository has no code-signing
# certificate, so macOS dmg/zip and the Windows nsis/portable builds are unsigned.
# electron-builder downloads the Electron distribution itself (the npm postinstall
# script is skipped by the pnpm workspace `onlyBuiltDependencies` policy); if a
# runner cannot reach the download host the packaging step fails loudly instead of
# producing a truncated artifact. Do not add `continue-on-error` around it.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/desktop.yml"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Matrix packaging job. `desktop-qa` (scripts/qa-desktop.mjs) declares
  # `needs: [package]`; keep the job id stable.
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Never look for a signing identity on any platform.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer (Vite, relative base for the packaged app:// protocol)
        run: pnpm -C apps/web build

      - name: Build desktop bundle (main + preload + renderer copy)
        run: pnpm -C apps/desktop build

      - name: Package (${{ matrix.os }})
        # The apps/desktop `dist` script already passes `--publish never`.
        run: pnpm -C apps/desktop dist

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: atlas-forge-desktop-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.yml
          if-no-files-found: error
          retention-days: 14

  # ── Packaged-artifact E2E (desktop-qa) ──────────────────────────────────
  # Runs scripts/qa-desktop.mjs (Playwright `_electron`, packaged mode only)
  # against the *released* Linux package: the AppImage produced by `package`
  # is downloaded and extracted with `--appimage-extract` (no FUSE needed), so
  # the suite covers exactly the bytes users download instead of a second
  # local build. Screenshots + report.json are uploaded even on failure.
  #
  # `needs: package` is intentional (see the note on the `package` job). The
  # QA step fails the workflow when the packaged artifact is unusable; use
  # ATLAS_QA_NO_SANDBOX / ELECTRON_DISABLE_SANDBOX because GitHub runners have
  # no usable Chromium sandbox (and no GPU).
  desktop-qa:
    name: desktop packaged E2E (ubuntu, xvfb)
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the Linux AppImage built by `package`
        uses: actions/download-artifact@v4
        with:
          name: atlas-forge-desktop-ubuntu-latest
          path: dist-artifacts

      - name: Extract the AppImage (no FUSE needed with --appimage-extract)
        run: |
          chmod +x dist-artifacts/*.AppImage
          (cd dist-artifacts && ./AtlasForge-*.AppImage --appimage-extract)
          test -d dist-artifacts/squashfs-root

      - name: System dependencies (xvfb + Electron runtime libraries)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libnss3 libgbm1 libxss1
          # Ubuntu 24.04 renamed several runtime libraries with the `t64` suffix.
          sudo apt-get install -y --no-install-recommends libasound2t64 libatk-bridge2.0-0t64 libgtk-3-0t64 \
            || sudo apt-get install -y --no-install-recommends libasound2 libatk-bridge2.0-0 libgtk-3-0

      - name: Desktop packaged E2E (Playwright _electron + xvfb)
        run: xvfb-run -a node scripts/qa-desktop.mjs
        env:
          # Point the harness at the extracted AppImage content.
          ATLAS_DESKTOP_APP: ${{ github.workspace }}/dist-artifacts/squashfs-root
          # No fallback to "electron + apps/desktop" is accepted in CI.
          ATLAS_QA_REQUIRE_PACKAGED: "1"
          # GitHub runners have no usable Chromium sandbox and no GPU.
          ATLAS_QA_NO_SANDBOX: "1"
          ELECTRON_DISABLE_SANDBOX: "1"

      - name: Upload QA report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-qa-report
          path: |
            out/desktop-qa/report.json
            out/desktop-qa/run.log
            out/desktop-qa/*.png
          if-no-files-found: warn
          retention-days: 14
